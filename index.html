  a.dl { display:flex; align-items:center; justify-content:center; gap:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; font-size:16px; padding:15px 16px; border-radius:12px; min-height:52px; }

  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 16px 32px; }

const $ = id => document.getElementById(id);
const codes = D.langs.map(l => l.code);
function detect() {
  const h = decodeURIComponent(location.hash.replace('#','')); if (codes.includes(h)) return h;
  for (const n of (navigator.languages || [navigator.language || 'en'])) {
    const s = n.toLowerCase();
    if (s.startsWith('ko')) return 'ko'; if (s.startsWith('ja')) return 'ja'; if (s.startsWith('th')) return 'th';
    if (s.startsWith('ms')) return 'ms'; if (s.startsWith('es')) return 'es';
    if (s.startsWith('zh')) { if (/hk|yue|mo/.test(s)) return 'zh-HK'; if (/tw|hant/.test(s)) return 'zh-TW'; return 'zh-CN'; }
    if (s.startsWith('en')) return 'en';
  }
  return 'en';
}
function render(code) {
  const ui = D.ui[code]; const meta = D.langs.find(l => l.code === code);
  document.documentElement.lang = meta.html;
  $('h1').textContent = ui[0]; $('lead').textContent = ui[1];
  $('langs').innerHTML = '';
  D.langs.forEach(l => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = l.name; b.lang = l.html;
    b.setAttribute('aria-pressed', String(l.code === code));
    b.onclick = () => { history.replaceState(null, '', '#' + l.code); render(l.code); };
    $('langs').appendChild(b);
  });
  $('cards').innerHTML = '';
  D.decks.forEach(d => {
    const f = d.files[code] || d.files['en']; if (!f) return;
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = '<div class="tag"></div><h2></h2><p class="sub"></p><a class="dl" download><span></span><small></small></a>';
    c.querySelector('.tag').textContent = d.label;
    c.querySelector('h2').textContent = f.title; c.querySelector('h2').lang = meta.html;
    c.querySelector('.sub').textContent = d.sub;
    const a = c.querySelector('a'); a.href = f.url; a.querySelector('span').textContent = ui[2]; a.querySelector('small').textContent = 'PDF · ' + f.mb + ' MB';
    $('cards').appendChild(c);
  });
}
render(detect());
